[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nba2k16-card-studio"
version = "0.11.3"
description = "Standalone deterministic NBA 2K16-style card template editor"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "PySide6>=6.7,<7",
  "Pillow>=10.4,<13",
  "numpy>=2.0,<3",
  "opencv-python-headless>=4.10,<5",
  "onnxruntime>=1.23,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pyinstaller>=6.11,<7", "scipy>=1.18,<2"]

[project.scripts]
nba2k16-card-studio = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
